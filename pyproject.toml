[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wan-animate-cog"
version = "0.1.0"
description = "Quality-first accelerated Cog and RunPod Serverless adapter for Wan-Animate-2"
requires-python = ">=3.10"
dependencies = [
  "av==15.1.0",
  "decord==0.6.0",
  "huggingface-hub[hf-xet]>=1.23,<2",
  "numpy>=2.1,<3",
  "opencv-python-headless==4.12.0.88",
  "pillow==11.3.0",
  "runpod==1.7.13",
]

[project.optional-dependencies]
gallery = [
  "boto3>=1.40,<2",
]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.setuptools]
py-modules = ["acceleration", "attention", "media", "rp_handler", "run", "runtime"]
